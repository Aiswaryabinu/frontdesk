databases:
  - name: frontdesk-db
    plan: free
    databaseName: frontdesk
    user: frontdesk

services:
  - type: web
    name: frontdesk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
      - key: PGSSL
        value: require
      - key: SEED_PASSWORD
        generateValue: true
